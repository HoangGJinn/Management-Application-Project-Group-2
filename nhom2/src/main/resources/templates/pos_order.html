<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff POS - Order</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --surface: #ffffff;
            --sidebar: #2b1d14;
            --sidebar-soft: #493222;
            --accent: #c7793f;
            --accent-dark: #9f5b2d;
            --text: #251915;
            --muted: #7b6f68;
            --border: #e8dfd7;
            --danger: #b84f42;
            --disabled: #b9b0aa;
            --shadow: 0 16px 40px rgba(43, 29, 20, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-shell {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(180deg, var(--sidebar), var(--sidebar-soft));
            color: #fff;
            padding: 24px 18px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0;
            margin-bottom: 28px;
        }

        .nav {
            display: grid;
            gap: 8px;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.82);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            display: block;
        }

        .nav a.active,
        .nav a:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .main {
            padding: 28px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 6px;
        }

        h1 {
            font-size: 32px;
            margin: 0;
            line-height: 1.1;
        }

        .order-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .order-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .order-panel h2 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        .order-items {
            display: grid;
            gap: 14px;
            min-height: 200px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            background: #fbfaf8;
        }

        .order-empty {
            color: var(--muted);
            font-size: 16px;
            padding: 40px 16px;
            text-align: center;
        }

        .order-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 12px;
            padding: 14px;
            background: var(--surface);
            border-radius: 6px;
            border: 1px solid var(--border);
            align-items: start;
        }

        .order-item-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .order-item-name {
            font-weight: 800;
            font-size: 15px;
        }

        .order-item-details {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .order-item-customization {
            font-size: 12px;
            color: var(--accent);
            margin-top: 4px;
            font-weight: 700;
        }

        .order-item-price {
            font-weight: 800;
            font-size: 16px;
            min-width: 70px;
            text-align: right;
        }

        .order-item-remove {
            background: var(--danger);
            border: none;
            color: #fff;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-item-remove:hover {
            background: #9f4238;
        }

        .order-summary {
            background: #fbfaf8;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .summary-row.total {
            border-top: 2px solid var(--border);
            padding-top: 12px;
            margin-top: 12px;
            font-size: 18px;
            font-weight: 800;
        }

        .summary-label {
            color: var(--text);
        }

        .summary-value {
            font-weight: 700;
            color: var(--accent);
        }

        .order-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 14px 20px;
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-back {
            background: var(--border);
            color: var(--text);
        }

        .btn-back:hover {
            background: #ddd;
        }

        .btn-clear {
            background: #e8c4b8;
            color: var(--text);
        }

        .btn-clear:hover {
            background: #ddb3a3;
        }

        .btn-checkout {
            grid-column: 1 / -1;
            background: var(--accent);
            color: #fff;
        }

        .btn-checkout:hover {
            background: var(--accent-dark);
        }

        .btn-checkout:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                height: auto;
            }
        }

        @media (max-width: 640px) {
            .main {
                padding: 18px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 26px;
            }

            .order-item {
                grid-template-columns: 1fr auto;
            }

            .order-item-remove {
                grid-column: 2;
                grid-row: 1 / 3;
            }

            .order-item-price {
                grid-column: 2;
                text-align: left;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">BrewBean</div>
        <nav class="nav" aria-label="Staff navigation">
            <a href="/pos_menu">Menu</a>
            <a href="/pos_order" class="active">Order</a>
            <a href="/pos">Dashboard</a>
            <a href="/logout">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="eyebrow">Staff POS - Order</p>
                <h1>Current Order</h1>
            </div>
        </header>

        <div class="order-container">
            <div class="success-message" id="successMessage">
                ✓ Order submitted successfully!
            </div>

            <div class="order-panel">
                <div id="orderItems" class="order-items">
                    <div class="order-empty">No items in order yet</div>
                </div>

                <div class="order-summary">
                    <div class="summary-row">
                        <span class="summary-label">Items:</span>
                        <span class="summary-value" id="itemCount">0</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Quantity:</span>
                        <span class="summary-value" id="totalQty">0</span>
                    </div>
                    <div class="summary-row total">
                        <span class="summary-label">Total:</span>
                        <span class="summary-value" id="orderTotal">$0.00</span>
                    </div>
                </div>

                <div class="order-actions">
                    <a href="/pos_menu" class="btn btn-back">← Back to Menu</a>
                    <button type="button" class="btn btn-clear" id="clearCartBtn">Clear Cart</button>
                    <form id="checkoutForm" th:action="@{/pos/checkout}" method="post" style="grid-column: 1 / -1;">
                        <input type="hidden" name="cartJson" id="cartJson">
                        <button type="submit" class="btn btn-checkout" id="checkoutBtn">Checkout</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const orderItems = document.getElementById('orderItems');
    const orderTotal = document.getElementById('orderTotal');
    const itemCount = document.getElementById('itemCount');
    const totalQty = document.getElementById('totalQty');
    const cartJson = document.getElementById('cartJson');
    const checkoutForm = document.getElementById('checkoutForm');
    const checkoutBtn = document.getElementById('checkoutBtn');
    const clearCartBtn = document.getElementById('clearCartBtn');
    const successMessage = document.getElementById('successMessage');

    function getCart() {
        const cartStr = sessionStorage.getItem('posCart');
        return cartStr ? JSON.parse(cartStr) : [];
    }

    function saveCart(cart) {
        sessionStorage.setItem('posCart', JSON.stringify(cart));
    }

    function formatMoney(value) {
        return '$' + value.toFixed(2);
    }

    function renderOrder() {
        const cart = getCart();
        orderItems.innerHTML = '';
        let total = 0;
        let totalQuantity = 0;
        let itemsCount = cart.length;

        if (cart.length === 0) {
            orderItems.innerHTML = '<div class="order-empty">No items in order yet</div>';
            checkoutBtn.disabled = true;
        } else {
            checkoutBtn.disabled = false;
        }

        cart.forEach((item, index) => {
            total += item.price * item.quantity;
            totalQuantity += item.quantity;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'order-item';
            itemDiv.innerHTML = `
                <div class="order-item-info">
                    <div class="order-item-name">${item.name}</div>
                    <div class="order-item-details">${item.quantity} × ${formatMoney(item.price)} = ${formatMoney(item.price * item.quantity)}</div>
                    <div class="order-item-customization">
                        ${item.size} | Ice: ${item.iceLevel} | Sugar: ${item.sugarLevel} | ${item.temperature}
                    </div>
                </div>
                <div class="order-item-price">${formatMoney(item.price * item.quantity)}</div>
                <button type="button" class="order-item-remove" data-index="${index}">×</button>
            `;
            orderItems.appendChild(itemDiv);
        });

        itemCount.textContent = itemsCount;
        totalQty.textContent = totalQuantity;
        orderTotal.textContent = formatMoney(total);
        cartJson.value = JSON.stringify(cart);

        // Add remove listeners
        document.querySelectorAll('.order-item-remove').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.dataset.index);
                const cart = getCart();
                cart.splice(index, 1);
                saveCart(cart);
                renderOrder();
            });
        });
    }

    clearCartBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to clear the entire order?')) {
            saveCart([]);
            renderOrder();
        }
    });

    checkoutForm.addEventListener('submit', event => {
        const cart = getCart();
        if (cart.length === 0) {
            event.preventDefault();
            alert('Please add items to the order before checkout.');
        }
    });

    renderOrder();

    // Check if returning from checkout
    window.addEventListener('load', () => {
        if (sessionStorage.getItem('orderSubmitted') === 'true') {
            successMessage.style.display = 'block';
            sessionStorage.removeItem('orderSubmitted');
            sessionStorage.removeItem('posCart');
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
            renderOrder();
        }
    });
</script>
</body>
</html>
