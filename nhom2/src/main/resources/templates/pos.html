<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff POS - Cafe Menu</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --surface: #ffffff;
            --sidebar: #2b1d14;
            --sidebar-soft: #493222;
            --accent: #c7793f;
            --accent-dark: #9f5b2d;
            --text: #251915;
            --muted: #7b6f68;
            --border: #e8dfd7;
            --danger: #b84f42;
            --disabled: #b9b0aa;
            --shadow: 0 16px 40px rgba(43, 29, 20, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-shell {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(180deg, var(--sidebar), var(--sidebar-soft));
            color: #fff;
            padding: 24px 18px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0;
            margin-bottom: 28px;
        }

        .nav {
            display: grid;
            gap: 8px;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.82);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            display: block;
        }

        .nav a.active,
        .nav a:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .main {
            padding: 28px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 6px;
        }

        h1 {
            font-size: 32px;
            margin: 0;
            line-height: 1.1;
        }

        .staff-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--muted);
            white-space: nowrap;
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 22px;
            align-items: start;
        }

        .toolbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .category-btn {
            border: 1px solid var(--border);
            background: #fbfaf8;
            color: var(--text);
            border-radius: 999px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 700;
        }

        .category-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .search-row input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        .search-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(199, 121, 63, 0.14);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .menu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 360px;
        }

        .menu-card.hidden {
            display: none;
        }

        .menu-card.is-disabled {
            opacity: 0.74;
        }

        .menu-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #e8dfd7;
        }

        .menu-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            flex: 1;
        }

        .menu-meta {
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 800;
        }

        .menu-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .menu-desc {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            min-height: 40px;
        }

        .menu-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
        }

        .price {
            font-size: 18px;
            font-weight: 800;
        }

        .select-btn,
        .pay-btn {
            border: 0;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            padding: 10px 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .select-btn:hover,
        .pay-btn:hover {
            background: var(--accent-dark);
        }

        .select-btn:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }

        .stock-label {
            color: var(--danger);
            font-size: 13px;
            font-weight: 800;
            margin-top: 2px;
        }

        .empty-state {
            display: none;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 28px;
            color: var(--muted);
            text-align: center;
        }

        .order-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 18px;
            position: sticky;
            top: 24px;
        }

        .order-panel h2 {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .order-items {
            display: grid;
            gap: 10px;
            min-height: 80px;
        }

        .order-empty {
            color: var(--muted);
            font-size: 14px;
            padding: 16px 0;
        }

        .order-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .order-item-name {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .order-item-meta {
            color: var(--muted);
            font-size: 13px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--border);
            padding-top: 14px;
            margin-top: 16px;
            font-size: 18px;
            font-weight: 800;
        }

        .pay-btn {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            font-size: 15px;
        }

        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                height: auto;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .order-panel {
                position: static;
            }
        }

        @media (max-width: 640px) {
            .main {
                padding: 18px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">BrewBean</div>
        <nav class="nav" aria-label="Staff navigation">
            <a href="/pos">Dashboard</a>
            <a href="/pos" class="active">Menu</a>
            <a href="/pos">Orders</a>
            <a href="/pos">Customers</a>
            <a href="/logout">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="eyebrow">Staff POS</p>
                <h1>Café Shop Menu</h1>
            </div>
        </header>

        <div class="content-grid">
            <section aria-label="Menu catalog">
                <div class="toolbar">
                    <div class="category-filter" aria-label="Category filter">
                        <button type="button" class="category-btn active" data-category="All">All</button>
                        <button type="button" class="category-btn" data-category="Coffee">Coffee</button>
                        <button type="button" class="category-btn" data-category="Tea">Tea</button>
                        <button type="button" class="category-btn" data-category="Juice">Juice</button>
                        <button type="button" class="category-btn" data-category="Cake">Cake</button>
                        <button type="button" class="category-btn" data-category="Food">Food</button>
                        <button type="button" class="category-btn" data-category="Other">Other</button>
                    </div>
                    <div class="search-row">
                        <input id="menuSearch" type="search" placeholder="Search menu item by name">
                    </div>
                </div>

                <div id="menuGrid" class="menu-grid">
                    <article th:each="p : ${products}"
                             class="menu-card"
                             th:classappend="${p.status.name() == 'OUT_OF_STOCK'} ? ' is-disabled' : ''"
                             th:attr="data-name=${p.productName}, data-category=${p.category != null ? p.category.categoryName : 'Other'}, data-status=${p.status.name()}">
                        <img class="menu-image"
                             th:src="${p.imageUrl != null && !#strings.isEmpty(p.imageUrl) ? p.imageUrl : 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80'}"
                             th:alt="${p.productName}">
                        <div class="menu-body">
                            <div class="menu-meta" th:text="${p.category != null ? p.category.categoryName : 'Other'}">Coffee</div>
                            <h2 class="menu-title" th:text="${p.productName}">Black Coffee</h2>
                            <p class="menu-desc" th:text="${p.description != null ? p.description : 'Freshly prepared cafe item.'}">Freshly prepared cafe item.</p>
                            <div class="stock-label" th:if="${p.status.name() == 'OUT_OF_STOCK'}">Out of stock</div>
                            <div class="menu-footer">
                                <div class="price" th:text="${'$' + #numbers.formatDecimal(p.basePrice, 1, 2)}">$3.75</div>
                                <button type="button"
                                        class="select-btn"
                                        th:disabled="${p.status.name() == 'OUT_OF_STOCK'}"
                                        th:attr="data-id=${p.productId}, data-name=${p.productName}, data-price=${p.basePrice}">
                                    Add to Order
                                </button>
                            </div>
                        </div>
                    </article>
                </div>
                <div id="emptyState" class="empty-state">No menu items found.</div>
            </section>

            <aside class="order-panel" aria-label="Current order">
                <h2>Current Order</h2>
                <div id="orderItems" class="order-items">
                    <div class="order-empty">No items selected.</div>
                </div>
                <div class="order-total">
                    <span>Total</span>
                    <span id="orderTotal">$0.00</span>
                </div>
                <form id="checkoutForm" th:action="@{/pos/checkout}" method="post">
                    <input type="hidden" name="cartJson" id="cartJson">
                    <button type="submit" class="pay-btn">Checkout</button>
                </form>
            </aside>
        </div>
    </main>
</div>

<script>
    const categoryButtons = document.querySelectorAll('.category-btn');
    const searchInput = document.getElementById('menuSearch');
    const menuCards = document.querySelectorAll('.menu-card');
    const emptyState = document.getElementById('emptyState');
    const orderItems = document.getElementById('orderItems');
    const orderTotal = document.getElementById('orderTotal');
    const cartJson = document.getElementById('cartJson');
    const checkoutForm = document.getElementById('checkoutForm');

    let selectedCategory = 'All';
    let keyword = '';
    const cart = [];

    function formatMoney(value) {
        return '$' + value.toFixed(2);
    }

    function applyFilters() {
        let visibleCount = 0;
        const normalizedKeyword = keyword.trim().toLowerCase();

        menuCards.forEach(card => {
            const itemCategory = card.dataset.category;
            const itemName = card.dataset.name.toLowerCase();
            const matchesCategory = selectedCategory === 'All' || itemCategory === selectedCategory;
            const matchesKeyword = normalizedKeyword === '' || itemName.includes(normalizedKeyword);
            const shouldShow = matchesCategory && matchesKeyword;

            card.classList.toggle('hidden', !shouldShow);
            if (shouldShow) {
                visibleCount++;
            }
        });

        emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    function renderOrder() {
        orderItems.innerHTML = '';
        let total = 0;
        let totalQuantity = 0;

        if (cart.length === 0) {
            orderItems.innerHTML = '<div class="order-empty">No items selected.</div>';
        }

        cart.forEach(item => {
            total += item.price * item.quantity;
            totalQuantity += item.quantity;

            const row = document.createElement('div');
            row.className = 'order-item';
            row.innerHTML = `
                <div>
                    <div class="order-item-name">${item.name}</div>
                    <div class="order-item-meta">${item.quantity} item(s) x ${formatMoney(item.price)}</div>
                </div>
                <strong>${formatMoney(item.price * item.quantity)}</strong>
            `;
            orderItems.appendChild(row);
        });

        orderTotal.innerText = `${formatMoney(total)} (${totalQuantity} item${totalQuantity === 1 ? '' : 's'})`;
        cartJson.value = JSON.stringify(cart.map(item => ({
            productId: item.id,
            quantity: item.quantity,
            size: 'M',
            iceLevel: '100%',
            sugarLevel: '100%',
            temperature: 'ICE'
        })));
    }

    categoryButtons.forEach(button => {
        button.addEventListener('click', () => {
            selectedCategory = button.dataset.category;
            categoryButtons.forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            applyFilters();
        });
    });

    searchInput.addEventListener('input', event => {
        keyword = event.target.value;
        applyFilters();
    });

    document.addEventListener('click', event => {
        const button = event.target.closest('.select-btn');
        if (!button || button.disabled) {
            return;
        }

        const id = Number(button.dataset.id);
        const name = button.dataset.name;
        const price = Number(button.dataset.price);
        const existingItem = cart.find(item => item.id === id);

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ id, name, price, quantity: 1 });
        }

        renderOrder();
    });

    checkoutForm.addEventListener('submit', event => {
        if (cart.length === 0) {
            event.preventDefault();
            alert('Please select at least one menu item.');
        }
    });

    applyFilters();
    renderOrder();
</script>
</body>
</html>
