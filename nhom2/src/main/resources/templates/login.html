<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body{font-family:Arial;margin:0;padding:0;display:flex;align-items:center;justify-content:center;height:100vh}
        .card{width:360px;padding:24px;border:1px solid #ddd;border-radius:6px}
        .error{color:#b00}
    </style>
</head>
<body>
<div class="card">
    <h2>Sign In</h2>
    <form th:action="@{/login}" method="post">
        <div>
            <label>Username</label>
            <input name="username" required />
        </div>
        <div style="margin-top:8px">
            <label>Password</label>
            <input type="password" name="password" required />
        </div>
        <div style="margin-top:12px">
            <button type="submit">Login</button>
        </div>
    </form>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <p style="margin-top:8px;font-size:13px">Sample accounts: admin/admin123, staff/staff123</p>
</div>
</body>
</html>
