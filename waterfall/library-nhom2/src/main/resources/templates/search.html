<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm - Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
</head>
<body>
<div class="container-flex">
    <aside class="sidebar">
        <div class="logo">📚 LMS</div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="nav-item"><span>📊</span> Dashboard</a>
            <a th:href="@{/books-manage}" href="/books-manage" class="nav-item"><span>📖</span> Quản lý Sách</a>
            <a th:href="@{/members-manage}" href="/members-manage" class="nav-item"><span>👥</span> Quản lý Độc giả</a>
            <a th:href="@{/loans-manage}" href="/loans-manage" class="nav-item"><span>🔄</span> Mượn/Trả</a>
            <a href="#" class="nav-item active"><span>🔍</span> Tìm kiếm</a>
            <a th:href="@{/reports}" href="/reports" class="nav-item"><span>📈</span> Báo cáo</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-header">
            <h2>Tìm kiếm</h2>
        </header>

        <section class="table-section" style="margin: 20px 40px;">
            <h3>Tìm kiếm Sách</h3>
            <div class="form-group">
                <input type="text" id="search-book-input" placeholder="Nhập tên sách, tác giả, hoặc ISBN..." style="width: 100%; padding: 12px;" />
            </div>
            <table id="search-books-result">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Sách</th>
                        <th>Tác giả</th>
                        <th>Thể loại</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="table-section" style="margin: 20px 40px; margin-top: 40px;">
            <h3>Tìm kiếm Độc giả</h3>
            <div class="form-group">
                <input type="text" id="search-member-input" placeholder="Nhập tên hoặc email độc giả..." style="width: 100%; padding: 12px;" />
            </div>
            <table id="search-members-result">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Độc giả</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>
</div>

<script th:src="@{/js/mock-api.js}" src="/js/mock-api.js"></script>
<script>
    document.getElementById('search-book-input').addEventListener('input', function(){
        const query = this.value;
        searchBooks(query);
    });

    document.getElementById('search-member-input').addEventListener('input', function(){
        const query = this.value;
        searchMembers(query);
    });

    function searchBooks(query) {
        if(!query) {
            document.querySelector('#search-books-result tbody').innerHTML = '';
            return;
        }
        alert('TODO: Implement searchBooks(' + query + ')');
    }

    function searchMembers(query) {
        if(!query) {
            document.querySelector('#search-members-result tbody').innerHTML = '';
            return;
        }
        alert('TODO: Implement searchMembers(' + query + ')');
    }
</script>
</body>
</html>
