<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Quản lý Độc giả - Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
</head>
<body>
<div class="container-flex">
    <aside class="sidebar">
        <div class="logo">📚 LMS</div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="nav-item"><span>📊</span> Dashboard</a>
            <a th:href="@{/books-manage}" href="/books-manage" class="nav-item"><span>📖</span> Quản lý Sách</a>
            <a href="#" class="nav-item active"><span>👥</span> Quản lý Độc giả</a>
            <a th:href="@{/loans-manage}" href="/loans-manage" class="nav-item"><span>🔄</span> Mượn/Trả</a>
            <a th:href="@{/search}" href="/search" class="nav-item"><span>🔍</span> Tìm kiếm</a>
            <a th:href="@{/reports}" href="/reports" class="nav-item"><span>📈</span> Báo cáo</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-header">
            <h2>Quản lý Độc giả</h2>
            <button class="btn" id="btn-add-member">+ Thêm Độc giả</button>
        </header>

        <section class="table-section" style="margin: 20px 40px;">
            <table id="members-manage-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Độc giả</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>
</div>

<!-- Modal Thêm/Sửa Độc giả -->
<div id="modal-member" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">Thêm Độc giả</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="form-member">
            <div class="form-group">
                <label>Tên Độc giả *</label>
                <input type="text" id="member-name" required />
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="member-email" required />
            </div>
            <div class="form-group">
                <label>Điện thoại *</label>
                <input type="tel" id="member-phone" required />
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <textarea id="member-address" rows="3"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Lưu</button>
                <button type="button" class="btn" onclick="closeModal()" style="background: #888;">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/mock-api.js}" src="/js/mock-api.js"></script>
<script>
    document.getElementById('btn-add-member').addEventListener('click', function(){ openModal('add'); });
    document.getElementById('form-member').addEventListener('submit', function(e){
        e.preventDefault();
        const member = {
            name: document.getElementById('member-name').value,
            email: document.getElementById('member-email').value,
            phone: document.getElementById('member-phone').value,
            address: document.getElementById('member-address').value
        };
        saveMember(member);
    });

    function openModal(mode) {
        document.getElementById('modal-title').textContent = mode === 'add' ? 'Thêm Độc giả' : 'Sửa Độc giả';
        document.getElementById('form-member').reset();
        document.getElementById('modal-member').classList.add('show');
    }

    function closeModal() {
        document.getElementById('modal-member').classList.remove('show');
    }

    function saveMember(member) {
        alert('TODO: Implement saveMember. Data: ' + JSON.stringify(member));
        closeModal();
    }

    function editMember(id) {
        alert('TODO: Edit member ' + id);
        openModal('edit');
    }

    function deleteMember(id) {
        if(confirm('Xác nhận xóa?')) alert('TODO: Delete member ' + id);
    }

    // Load initial data
    loadMembersManage();
</script>
</body>
</html>
