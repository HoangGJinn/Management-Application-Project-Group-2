<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Quản lý Sách - Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
</head>
<body>
<div class="container-flex">
    <aside class="sidebar">
        <div class="logo">📚 LMS</div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="nav-item"><span>📊</span> Dashboard</a>
            <a href="#" class="nav-item active"><span>📖</span> Quản lý Sách</a>
            <a th:href="@{/members-manage}" href="/members-manage" class="nav-item"><span>👥</span> Quản lý Độc giả</a>
            <a th:href="@{/loans-manage}" href="/loans-manage" class="nav-item"><span>🔄</span> Mượn/Trả</a>
            <a th:href="@{/search}" href="/search" class="nav-item"><span>🔍</span> Tìm kiếm</a>
            <a th:href="@{/reports}" href="/reports" class="nav-item"><span>📈</span> Báo cáo</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-header">
            <h2>Quản lý Sách</h2>
            <button class="btn" id="btn-add-book">+ Thêm Sách Mới</button>
        </header>

        <section class="table-section" style="margin: 20px 40px;">
            <table id="books-manage-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Sách</th>
                        <th>Tác giả</th>
                        <th>Thể loại</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>
</div>

<!-- Modal Thêm/Sửa Sách -->
<div id="modal-book" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">Thêm Sách</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="form-book">
            <div class="form-group">
                <label>Tên Sách *</label>
                <input type="text" id="book-title" required />
            </div>
            <div class="form-group">
                <label>Tác giả *</label>
                <input type="text" id="book-author" required />
            </div>
            <div class="form-group">
                <label>Thể loại *</label>
                <input type="text" id="book-category" required />
            </div>
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="book-isbn" />
            </div>
            <div class="form-group">
                <label>Năm Xuất bản</label>
                <input type="number" id="book-year" />
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Lưu</button>
                <button type="button" class="btn" onclick="closeModal()" style="background: #888;">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/mock-api.js}" src="/js/mock-api.js"></script>
<script>
    document.getElementById('btn-add-book').addEventListener('click', function(){ openModal('add'); });
    document.getElementById('form-book').addEventListener('submit', function(e){
        e.preventDefault();
        const book = {
            title: document.getElementById('book-title').value,
            author: document.getElementById('book-author').value,
            category: document.getElementById('book-category').value,
            isbn: document.getElementById('book-isbn').value,
            year: document.getElementById('book-year').value
        };
        saveBook(book);
    });

    function openModal(mode) {
        document.getElementById('modal-title').textContent = mode === 'add' ? 'Thêm Sách' : 'Sửa Sách';
        document.getElementById('form-book').reset();
        document.getElementById('modal-book').classList.add('show');
    }

    function closeModal() {
        document.getElementById('modal-book').classList.remove('show');
    }

    function saveBook(book) {
        alert('TODO: Implement saveBook. Data: ' + JSON.stringify(book));
        closeModal();
    }

    function editBook(id) {
        alert('TODO: Edit book ' + id);
        openModal('edit');
    }

    function deleteBook(id) {
        if(confirm('Xác nhận xóa?')) alert('TODO: Delete book ' + id);
    }

    // Load initial data
    loadBooksManage();
</script>
</body>
</html>
